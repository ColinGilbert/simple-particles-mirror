[package]
name = "simple-particles"
version = "0.3.1"
edition = "2024"
description = "Data-driven CPU particle system with a wgpu renderer and an egui live editor"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/porky11/simple-particles"
readme = "README.md"
keywords = ["particles", "wgpu", "gamedev", "vfx", "egui"]
categories = ["game-development", "rendering"]

[dependencies]
simple-vectors = "0.3.1"
header-parsing = "0.3.1"
wgpu = { version = "29", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
winit = { version = "0.30", optional = true }
egui = { version = "0.34", optional = true }
egui-winit = { version = "0.34", optional = true }
egui-wgpu = { version = "0.34", optional = true }
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[features]
default = []
render = ["dep:wgpu", "dep:bytemuck"]
editor = [
    "render",
    "dep:winit",
    "dep:egui",
    "dep:egui-winit",
    "dep:egui-wgpu",
    "dep:pollster",
    "dep:raw-window-handle",
]

[[bin]]
name = "particle-editor"
required-features = ["editor"]

[lints.rust]
warnings = { level = "deny", priority = -2 }

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_transmute_annotations = "deny"
expect_used = "deny"
cognitive_complexity = "allow"
suboptimal_flops = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
wildcard_imports = "allow"
inline_always = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
needless_pass_by_value = "allow"
enum_glob_use = "allow"
cast_possible_wrap = "allow"
items_after_statements = "allow"
unreadable_literal = "allow"
fn_params_excessive_bools = "allow"
too_many_arguments = "allow"
cast_lossless = "allow"
range_plus_one = "allow"
option_if_let_else = "allow"
match_same_arms = "allow"
semicolon_if_nothing_returned = "allow"
many_single_char_names = "allow"
suspicious_operation_groupings = "allow"
return_self_not_must_use = "allow"
struct_field_names = "allow"
implicit_hasher = "allow"
while_float = "allow"
missing_panics_doc = "allow"
trait_duplication_in_bounds = "allow"
needless_collect = "allow"
boxed_local = "allow"
float_cmp = "allow"
case_sensitive_file_extension_comparisons = "allow"
unchecked_time_subtraction = "allow"
suspicious_arithmetic_impl = "allow"
future_not_send = "allow"
