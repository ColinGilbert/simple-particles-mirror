[workspace]
members = ["editor"]

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }

[workspace.lints.clippy]
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
indexing_slicing = "deny"
string_slice = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[package]
name = "simple-particles"
version = "0.4.0"
edition = "2024"
description = "Data-driven CPU particle system with a wgpu renderer and an egui live editor"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/porky11/simple-particles"
readme = "README.md"
keywords = ["particles", "wgpu", "gamedev", "vfx", "egui"]
categories = ["game-development", "rendering"]

[dependencies]
simple-vectors = "0.5.2"
header-parsing = "0.3.1"
wgpu = { version = "29", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
document-state = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in", "glsl-out"] }

[features]
default = []
render = ["dep:wgpu", "dep:bytemuck"]
document = ["dep:document-state"]

[lints]
workspace = true

[patch.crates-io]
egui_tiles = { git = "https://github.com/porky11/egui_tiles", branch = "wrapping-tab-bar" }
