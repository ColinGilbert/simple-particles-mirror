[package]
name = "simple-particles"
version = "0.3.1"
edition = "2024"
description = "Data-driven CPU particle system with a wgpu renderer and an egui live editor"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/porky11/simple-particles"
readme = "README.md"
keywords = ["particles", "wgpu", "gamedev", "vfx", "egui"]
categories = ["game-development", "rendering"]

[dependencies]
simple-vectors = "0.3.1"
header-parsing = "0.3.1"
wgpu = { version = "29", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
winit = { version = "0.30", optional = true }
egui = { version = "0.34", optional = true }
egui-winit = { version = "0.34", optional = true }
egui-wgpu = { version = "0.34", optional = true }
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
matrix4 = { git = "https://gitlab.com/porky11/matrix4", optional = true }
ga3 = { version = "0.3", optional = true }

[features]
default = []
render = ["dep:wgpu", "dep:bytemuck"]
editor = [
    "render",
    "dep:winit",
    "dep:egui",
    "dep:egui-winit",
    "dep:egui-wgpu",
    "dep:pollster",
    "dep:raw-window-handle",
    "dep:matrix4",
    "dep:ga3",
]

[[bin]]
name = "particle-editor"
required-features = ["editor"]

[lints.rust]
warnings = { level = "deny", priority = -2 }

[lints.clippy]
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
